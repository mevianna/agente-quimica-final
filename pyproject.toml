[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-chem-agent"
version = "0.1.0"
description = "Terminal LLM agent for quantum-chemistry calculations with Ket"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "ollama>=0.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
chemistry = [
    "numpy",
    "pyscf",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
quantum-chem-agent = "quantum_chem_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
