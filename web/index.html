<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Química Quântica — Chat</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17211f;
        --muted: #63706c;
        --line: #dfe7e4;
        --surface: #ffffff;
        --soft: #f3f7f5;
        --brand: #176b55;
        --brand-dark: #105240;
        --user: #176b55;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f7faf8;
        color: var(--ink);
      }

      .app {
        width: min(860px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--surface);
        border-inline: 1px solid var(--line);
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 13px;
        background: var(--brand);
        color: white;
        font-size: 23px;
      }

      h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
      header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

      main {
        min-height: 0;
        overflow-y: auto;
        padding: 34px clamp(18px, 5vw, 54px);
      }

      .welcome { padding: 6vh 0 22px; text-align: center; }
      .welcome h2 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -0.035em; }
      .welcome p { max-width: 500px; margin: 12px auto 28px; color: var(--muted); line-height: 1.55; }

      .suggestions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        text-align: left;
      }

      .suggestion {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        line-height: 1.4;
        text-align: left;
        cursor: pointer;
        transition: border-color 150ms, background 150ms, transform 150ms;
      }

      .suggestion:hover { border-color: #9fc8ba; background: var(--soft); transform: translateY(-1px); }
      .suggestion span { display: block; margin-bottom: 7px; font-size: 19px; }

      .messages { display: grid; gap: 20px; }
      .message { display: flex; gap: 10px; max-width: 82%; line-height: 1.6; }
      .message.user { margin-left: auto; }
      .response-stack { display: grid; gap: 9px; min-width: 0; }
      .bubble { padding: 11px 15px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .assistant .bubble { background: var(--soft); border-bottom-left-radius: 5px; }
      .assistant .bubble.formatted { white-space: normal; }
      .formatted p { margin: 0; white-space: pre-wrap; }
      .formatted p + p { margin-top: 10px; }
      .formatted .message-heading { margin: 0 0 8px; font-weight: 750; }
      .formatted .math-display {
        margin: 10px 0;
        padding: 8px 12px;
        overflow-x: auto;
        font-family: Cambria Math, STIX Two Math, Georgia, serif;
        font-size: 1.12em;
        text-align: center;
        white-space: pre-wrap;
      }
      .formatted hr { margin: 12px 0; border: 0; border-top: 1px solid #c8d9d3; }
      .user .bubble { background: var(--user); color: white; border-bottom-right-radius: 5px; }
      .typing { color: var(--muted); font-style: italic; }

      .ket-proof {
        padding: 10px 12px;
        border: 1px solid #b7d8cd;
        border-radius: 13px;
        background: #f7fcfa;
      }

      .ket-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 999px;
        background: #dcefe8;
        color: var(--brand-dark);
        font-size: 12px;
        font-weight: 700;
      }

      .ket-badge::before { content: "✓"; }
      .lesson { margin-top: 9px; border-top: 1px solid #d8e8e2; padding-top: 8px; }
      .lesson summary { color: var(--brand-dark); cursor: pointer; font-size: 13px; font-weight: 650; }
      .lesson ol { margin: 10px 0; padding-left: 23px; color: #34443f; font-size: 13px; }
      .lesson li + li { margin-top: 5px; }
      .lesson pre {
        margin: 10px 0 2px;
        padding: 12px;
        overflow-x: auto;
        border-radius: 10px;
        background: #14201d;
        color: #eaf7f2;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      footer { padding: 14px clamp(16px, 4vw, 38px) 20px; border-top: 1px solid var(--line); }
      form {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        padding: 8px 8px 8px 15px;
        border: 1px solid #cbd7d2;
        border-radius: 18px;
        background: white;
        box-shadow: 0 6px 22px rgb(31 65 54 / 8%);
      }

      textarea {
        flex: 1;
        min-height: 42px;
        max-height: 140px;
        padding: 10px 0;
        resize: none;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font: inherit;
        line-height: 1.4;
      }

      textarea::placeholder { color: #89938f; }
      .send {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        border: 0;
        border-radius: 13px;
        background: var(--brand);
        color: white;
        font-size: 20px;
        cursor: pointer;
      }

      .send:hover { background: var(--brand-dark); }
      .send:disabled { opacity: .45; cursor: default; }
      .hint { margin: 8px 0 0; color: var(--muted); font-size: 11px; text-align: center; }

      @media (max-width: 600px) {
        .app { border: 0; }
        main { padding: 22px 16px; }
        .welcome { padding-top: 3vh; }
        .suggestions { grid-template-columns: 1fr; }
        .message { max-width: 92%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="mark" aria-hidden="true">⚛</div>
        <div>
          <h1>Assistente de Química Quântica</h1>
          <p>Tire dúvidas e execute cálculos reais com Ket</p>
        </div>
      </header>

      <main id="chat" aria-live="polite">
        <section class="welcome" id="welcome">
          <h2>Como posso ajudar?</h2>
          <p>Faça uma pergunta ou escolha uma sugestão para começar.</p>
          <div class="suggestions">
            <button class="suggestion" type="button"><span>🧪</span>O que é química quântica?</button>
            <button class="suggestion" type="button"><span>☁️</span>Explique orbitais moleculares de forma simples</button>
            <button class="suggestion" type="button"><span>⚛️</span>Qual é a diferença entre um bit e um qubit?</button>
            <button class="suggestion" type="button"><span>🔬</span>Mapeie a criação no orbital 2 com Jordan-Wigner</button>
          </div>
        </section>
        <section class="messages" id="messages"></section>
      </main>

      <footer>
        <form id="form">
          <textarea id="input" rows="1" maxlength="8000" placeholder="Digite sua pergunta..." aria-label="Mensagem"></textarea>
          <button class="send" id="send" type="submit" aria-label="Enviar">↑</button>
        </form>
        <p class="hint">Enter para enviar · Shift + Enter para quebrar a linha</p>
      </footer>
    </div>

    <script>
      const form = document.querySelector('#form');
      const input = document.querySelector('#input');
      const send = document.querySelector('#send');
      const chat = document.querySelector('#chat');
      const welcome = document.querySelector('#welcome');
      const messages = document.querySelector('#messages');
      let waiting = false;

      const supportedLessons = new Set([
        'fermion_mapping',
        'fermion_product',
        'fermion_adjoint',
        'fermion_normal_order',
        'fermion_conservation',
      ]);

      function addKetProof(container, calculation) {
        if (calculation.calculation_status !== 'completed' || calculation.calculation_provider !== 'Ket') return;

        const proof = document.createElement('section');
        proof.className = 'ket-proof';
        const badge = document.createElement('span');
        badge.className = 'ket-badge';
        badge.textContent = calculation.calculation_badge || 'Calculado com Ket';
        proof.appendChild(badge);

        const lesson = calculation.education;
        const canTeach = supportedLessons.has(calculation.calculation_type)
          && lesson?.available === true;
        if (canTeach) {
          const details = document.createElement('details');
          details.className = 'lesson';
          const summary = document.createElement('summary');
          summary.textContent = 'Aprenda a encontrar este resultado no Ket';
          details.appendChild(summary);

          const steps = document.createElement('ol');
          lesson.steps.forEach((stepText) => {
            const step = document.createElement('li');
            step.textContent = stepText;
            steps.appendChild(step);
          });
          details.appendChild(steps);

          const code = document.createElement('pre');
          code.textContent = lesson.code;
          details.appendChild(code);
          proof.appendChild(details);
        }
        container.appendChild(proof);
      }

      function readableMath(source) {
        const subscripts = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉' };
        return source
          .replace(/\^\{\\phantom\{\\dagger\}\}/g, '')
          .replace(/\^(?:\{\\dagger\}|\\dagger)/g, '†')
          .replace(/_(?:\{(\d+)\}|(\d+))/g, (_match, braced, plain) =>
            (braced || plain).split('').map((digit) => subscripts[digit]).join(''))
          .replace(/\\(?:,|;|!|quad|qquad)/g, ' ')
          .replace(/\\cdot/g, '·')
          .replace(/\\otimes/g, '⊗')
          .replace(/\\left|\\right/g, '')
          .trim();
      }

      function plainMarkdown(source) {
        return source
          .replace(/\$([^$\n]+)\$/g, (_match, expression) => readableMath(expression))
          .replace(/\*\*(.*?)\*\*/g, '$1')
          .replace(/__(.*?)__/g, '$1')
          .replace(/\`([^\`]+)\`/g, '$1');
      }

      function renderAssistantText(container, source) {
        container.classList.add('formatted');
        const lines = source.replace(/\r\n?/g, '\n').split('\n');
        let paragraph = [];
        let math = [];
        let inMath = false;

        const flushParagraph = () => {
          if (!paragraph.length) return;
          const element = document.createElement('p');
          element.textContent = plainMarkdown(paragraph.join('\n'));
          container.appendChild(element);
          paragraph = [];
        };

        const flushMath = () => {
          const element = document.createElement('div');
          element.className = 'math-display';
          element.textContent = readableMath(math.join(' '));
          container.appendChild(element);
          math = [];
        };

        lines.forEach((line) => {
          const trimmed = line.trim();
          if (trimmed === '$$') {
            if (inMath) flushMath();
            else flushParagraph();
            inMath = !inMath;
            return;
          }
          if (inMath) {
            math.push(trimmed);
            return;
          }
          if (/^---+$/.test(trimmed)) {
            flushParagraph();
            container.appendChild(document.createElement('hr'));
            return;
          }
          const heading = trimmed.match(/^#{1,6}\s+(.+)$/);
          if (heading) {
            flushParagraph();
            const element = document.createElement('div');
            element.className = 'message-heading';
            element.textContent = plainMarkdown(heading[1]);
            container.appendChild(element);
            return;
          }
          if (!trimmed) {
            flushParagraph();
            return;
          }
          paragraph.push(line);
        });
        if (inMath && math.length) flushMath();
        flushParagraph();
      }

      function addMessage(role, text, extraClass = '', calculations = []) {
        const article = document.createElement('article');
        article.className = `message ${role} ${extraClass}`;
        const stack = document.createElement('div');
        stack.className = 'response-stack';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'assistant' && !extraClass.includes('typing')) renderAssistantText(bubble, text);
        else bubble.textContent = text;
        stack.appendChild(bubble);
        calculations.forEach((calculation) => addKetProof(stack, calculation));
        article.appendChild(stack);
        messages.appendChild(article);
        chat.scrollTop = chat.scrollHeight;
        return article;
      }

      async function ask(text) {
        const message = text.trim();
        if (!message || waiting) return;
        waiting = true;
        welcome.hidden = true;
        input.value = '';
        input.style.height = 'auto';
        send.disabled = true;
        addMessage('user', message);
        const typing = addMessage('assistant', 'Pensando…', 'typing');

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Não foi possível obter uma resposta.');
          typing.remove();
          addMessage('assistant', data.answer, '', data.calculations || []);
        } catch (error) {
          typing.remove();
          addMessage('assistant', `Não consegui responder agora. ${error.message}`);
        } finally {
          waiting = false;
          send.disabled = false;
          input.focus();
        }
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        ask(input.value);
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
      });

      document.querySelectorAll('.suggestion').forEach((button) => {
        button.addEventListener('click', () => ask(button.textContent.trim().replace(/^[^\p{L}\p{N}]+/u, '')));
      });
    </script>
  </body>
</html>
